[project]
name = "taller-rf-miax15"
version = "0.1.0"
description = "MIAX 15 fixed-income portfolio analysis workshop"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "matplotlib",
    "pandas",
    "pulp>=3.3,<4",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
# Allow long coursework comments and docstrings while keeping the formatter's width target.
ignore = ["COM812", "CPY001", "D203", "D213", "E501", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.15"
files = ["src"]
mypy_path = "src"
warn_unreachable = true
