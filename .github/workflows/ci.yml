name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.15'
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked pytest -q
      - run: uv run --locked python -c "import pandas; import matplotlib; import ipykernel"
      - run: uv run --locked pre-commit run --all-files
        env:
          SKIP: branch-name
      - run: git diff --exit-code
