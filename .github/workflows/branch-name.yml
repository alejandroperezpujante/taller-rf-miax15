name: Branch name

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate source branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: python scripts/check_branch_name.py "$BRANCH_NAME"
