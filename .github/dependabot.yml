version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels: [dependencies, python]
    open-pull-requests-limit: 5
    groups:
      python-production:
        dependency-type: production
        patterns: ['*']
      python-development:
        dependency-type: development
        patterns: ['*']
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
